<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample App</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <h1>You are calling me from {{ request.remote_addr }}</h1>

    <!-- Form to add a new comment -->
    <form method="POST" action="/add">
        <input name="ip" placeholder="IP" required />
        <input name="username" placeholder="Username" required />
        <input name="password" placeholder="Password" required />
        <button type="submit">Add Comment</button>
    </form>

    <!-- Display existing comments -->
    <ul>
        {% for comment in comments %}
            <li>
                {{ comment.ip }} - {{ comment.username }}
                <!-- Form to delete a comment -->
                <form method="POST" action="{{ url_for('delete_comment') }}" style="display:inline">
                    <input type="hidden" name="idx" value="{{ loop.index0 }}">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
